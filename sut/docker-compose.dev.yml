# Dev override: runs the SUT with no external accounts.
# Firebase Auth/Firestore -> firebase-emulator, Google Places/Geocoding -> gplaces-mock.
# No .env files or credentials needed: env_file and the credentials mount are reset
# and the values are set here (!reset needs Docker Compose 2.24+).
#
#   dev:       docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   hot reload: add  -f docker-compose.hotreload.yml
#   prod:      docker compose up -d --build   (real Firebase + Google, see README)

services:

  gplaces-mock:
    build: ./gplaces-mock
    container_name: devorapp-gplaces-mock
    ports:
      - "8002:8002"   # also host-reachable: the browser loads photos from it
    networks:
      - devorapp-net

  firebase-emulator:
    build: ./firebase-emulator
    container_name: devorapp-firebase-emulator
    networks:
      - devorapp-net

  keras-api:
    env_file: !reset []
    environment:
      API_KEY_RECOMMENDER: devorapp_6f8e2b9a1c4d5e0f7a3b8c9d0e1f2a3b4c5d6e7f8
      MODEL_PATH: ./models/modelo_prod.h5
      PORT: "8001"
      DATABASE_URL: postgresql://postgres:password@db:5432/tfg_db
      GOOGLE_API_KEY: mock

  backend:
    env_file: !reset []
    volumes: !reset []   # the emulator needs no service-account file
    environment:
      FIREBASE_PROJECT_ID: epi-devorapp
      FIREBASE_API_KEY: mock
      GOOGLE_API_KEY: mock
      GOOGLE_CLIENT_ID: mock
      SECRET_KEY: dev-only-secret-key
      KERAS_API_KEY: devorapp_6f8e2b9a1c4d5e0f7a3b8c9d0e1f2a3b4c5d6e7f8
      # Firebase emulator (the Admin SDK then needs no service-account key)
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
      FIREBASE_AUTH_BASE_URL: http://firebase-emulator:9099/identitytoolkit.googleapis.com/v1
      SKIP_EMAIL_VERIFICATION: "true"   # no inbox to read the mail from
      COOKIE_SECURE: "false"            # plain HTTP: API clients drop Secure cookies
      # Places mock: server-side over the compose network, photo URLs via the host
      GOOGLE_PLACES_BASE_URL: http://gplaces-mock:8002/v1
      GOOGLE_GEOCODE_URL: http://gplaces-mock:8002/maps/api/geocode/json
      GOOGLE_PLACES_PHOTO_BASE_URL: http://localhost:8002/v1
    depends_on:
      gplaces-mock:
        condition: service_healthy
      firebase-emulator:
        condition: service_healthy
