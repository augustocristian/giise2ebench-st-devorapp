[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src" }]

[project]
name = "puppeteer-python"
version = "1.0.0"
dependencies = [
    "requests==2.34.2",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "flake8==7.5.0",
]

requires-python = ">=3.12"

authors = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]
maintainers = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]

description = "Puppeteer (via a Node bridge) + Python E2E and API test suite for DevorApp"
readme = "README.md"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=xml:coverage.xml --cov-branch --strict-markers -ra"
markers = [
    "api: API-only tests (tests/api) — no browser required.",
    "e2e: browser tests (tests/e2e) — require Chrome and the Node bridge.",
    "bridge: smoke tests of the Python-Node Puppeteer bridge (tests/bridge).",
]
asyncio_mode = "auto"
# One loop for the whole session so the session-scoped browser can be shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

#Configurations related to logging in testing, first
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
