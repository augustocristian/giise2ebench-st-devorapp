# ─────────────────────────────────────────────────────────────────────────────
# Dependabot configuration — giise2ebench-st-devorapp
#
# Sibling dependencies (declared in several manifests, or released as one
# train) must move together, or the SUT and the test suites drift apart:
#   · `directories:` — one entry spanning several manifests = one PR.
#   · `groups:` — packages that break when bumped apart.
#
# Lock files (npm, backend, keras-api): ONE group per lock file. Several groups
# open several PRs that rewrite the same lines of the lock, so merging one
# conflicts the rest. These entries also use `rebase-strategy: "auto"` so
# Dependabot regenerates a stale PR itself.
#
# Everything runs in the same weekly slot (Friday 00:40 Europe/Madrid).
#
# SonarQube is not run on Dependabot PRs (no SONAR_TOKEN); the `sonar-analysis`
# job in .github/workflows/ci.yml is guarded with `github.actor != 'dependabot[bot]'`.
# ─────────────────────────────────────────────────────────────────────────────
version: 2

updates:

  # ─── GitHub Actions (CI/CD workflows) ──────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "actions"
    commit-message:
      prefix: "ci"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
    groups:
      github-actions:
        patterns:
          - "*"

  # ─── SUT · frontend (React/Vite) + sut root manifest ───────────────────────
  # Both manifests share react-router-dom and react-google-autocomplete.
  - package-ecosystem: npm
    directories:
      - "/sut/frontend"
      - "/sut"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(frontend)"
      prefix-development: "deps(frontend-dev)"
    versioning-strategy: "increase"
    rebase-strategy: "auto"
    open-pull-requests-limit: 20
    groups:
      # One group per lock file (see header). Peer trains (react, vite, vitest,
      # typescript-eslint...) are resolved together; `npm ci` in CI checks them.
      frontend:
        patterns:
          - "*"
    ignore:
      # Majors need an Android Gradle Plugin / Gradle upgrade (android/variables.gradle).
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      # Pinned to ~5.9: typescript-eslint and @vitejs/plugin-react-swc support only that line.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # React 19 is the target of the view layer; a major is a migration.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # vitest 5 dropped the ambient jest-dom typings (broke `tsc -b`, fixed in
      # #44/#56 via the `/vitest` import). Bump by hand together with that import.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # ─── SUT · backend (FastAPI + Poetry) ──────────────────────────────────────
  - package-ecosystem: pip
    directory: "/sut/backend"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps(backend)"
    rebase-strategy: "auto"
    open-pull-requests-limit: 20
    groups:
      # One group per lock file (see header).
      backend:
        patterns:
          - "*"
    ignore:
      # The code targets SQLAlchemy 2.x; psycopg2 3.x is a different package (psycopg).
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "psycopg2*"
        update-types: ["version-update:semver-major"]
      # pydantic-settings 2.x requires pydantic v2 (app/core/config.py).
      - dependency-name: "pydantic*"
        update-types: ["version-update:semver-major"]

  # ─── SUT · keras-api (recommendation microservice) ─────────────────────────
  # Same slot as the backend: both share the FastAPI / SQLAlchemy / pytest stack.
  - package-ecosystem: pip
    directory: "/sut/keras-api"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "backend-ai"
    commit-message:
      prefix: "deps(keras-api)"
    rebase-strategy: "auto"
    open-pull-requests-limit: 20
    groups:
      # One group per lock file (see header).
      keras-api:
        patterns:
          - "*"
    ignore:
      # TensorFlow 3.x ships Keras 3, which cannot load the committed .h5 model.
      - dependency-name: "tensorflow*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "keras*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "psycopg2*"
        update-types: ["version-update:semver-major"]

  # ─── SUT · gplaces-mock (Google Places stand-in for the E2E phase) ─────────
  # Labelled `tests`, not `backend`: it is test infrastructure that the E2E
  # stages depend on, never a shipped service.
  - package-ecosystem: pip
    directory: "/sut/gplaces-mock"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(gplaces-mock)"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
    groups:
      # The mock answers with FastAPI and is exercised through its TestClient,
      # so its web stack must move as one, mirroring the two real services.
      fastapi-stack:
        patterns:
          - "fastapi"
          - "fastapi-*"
          - "starlette"
          - "uvicorn*"
          - "pydantic*"
          - "httpx"
      testing:
        patterns:
          - "pytest"
          - "pytest-*"
          - "coverage*"
          - "flake8"
      gplaces-mock-misc:
        patterns:
          - "*"

  # ─── SUT · container base images ───────────────────────────────────────────
  # backend and keras-api share python:3.12-slim; frontend has two Dockerfiles
  # on node:22-alpine. One entry keeps them from drifting.
  - package-ecosystem: docker
    directories:
      - "/sut/backend"
      - "/sut/frontend"
      - "/sut/keras-api"
      - "/sut/gplaces-mock"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
    groups:
      python-images:
        patterns:
          - "python"
      # Production and Dockerfile.dev must stay on the same Node.
      node-images:
        patterns:
          - "node"
      # Unrelated to the Node build stage: its own PR.
      nginx-images:
        patterns:
          - "nginx"
      docker-images-misc:
        patterns:
          - "*"
    ignore:
      # Siblings of the versions hardcoded in ci.yml (setup-python 3.12,
      # setup-node 22): bump by hand together with the workflow.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ─── SUT · docker compose service images (postgres) ────────────────────────
  # Delete this entry if your Dependabot deployment lacks `docker-compose`.
  - package-ecosystem: docker-compose
    directory: "/sut"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(compose)"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
    groups:
      compose-images:
        patterns:
          - "*"
    ignore:
      # A postgres major is a data migration, not a bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # ─── Test suite · selenium-java (Maven) ────────────────────────────────────
  - package-ecosystem: maven
    directory: "/selenium-java"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(selenium-java)"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
    groups:
      # selema only works within the same Selenium major.
      selenium:
        patterns:
          - "org.seleniumhq.selenium:*"
          - "io.github.javiertuya:selema"
      # Both share ${junit-jupiter-api.version} in pom.xml.
      junit:
        patterns:
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
      # Both share ${surefire.version} in pom.xml.
      surefire:
        patterns:
          - "org.apache.maven.plugins:maven-surefire-plugin"
          - "org.apache.maven.plugins:maven-surefire-report-plugin"
      # log4j-slf4j2-impl must match the slf4j-api major.
      logging:
        patterns:
          - "org.slf4j:*"
          - "org.apache.logging.log4j:*"
      # Used by the antrun junitreport target and JaCoCo.
      build-tooling:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"
          - "org.apache.ant:*"
      # Used together by the REST layer (BaseApiClass).
      api-client:
        patterns:
          - "org.apache.httpcomponents:*"
          - "com.google.code.gson:gson"
      selenium-java-misc:
        patterns:
          - "*"
    ignore:
      # Selenium 5 removes APIs used by the page objects and selema.
      - dependency-name: "org.seleniumhq.selenium:*"
        update-types: ["version-update:semver-major"]

  # ─── Test suite · cypress-js (npm) ─────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/cypress-js"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(cypress-js)"
    versioning-strategy: "increase"
    rebase-strategy: "auto"
    open-pull-requests-limit: 20
    groups:
      # One group per lock file (see header).
      cypress-js:
        patterns:
          - "*"

  # ─── Test suite · playwright-csharp (NuGet) ────────────────────────────────
  - package-ecosystem: nuget
    directory: "/playwright-csharp"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(playwright-csharp)"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
    groups:
      # Microsoft.Playwright and Microsoft.Playwright.NUnit ship as one train
      # (same version in the .csproj).
      playwright:
        patterns:
          - "Microsoft.Playwright*"
      # Runner side: NUnit, its adapter and the test SDK.
      test-runner:
        patterns:
          - "NUnit*"
          - "Microsoft.NET.Test.Sdk"
      playwright-csharp-misc:
        patterns:
          - "*"
    ignore:
      # The project targets net8.0 (LTS); NUnit 5 / SDK majors are bumped by hand.
      - dependency-name: "NUnit"
        update-types: ["version-update:semver-major"]

  # ─── Test suite · puppeteer-python (pip) ───────────────────────────────────
  - package-ecosystem: pip
    directory: "/puppeteer-python"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(puppeteer-python)"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
    groups:
      # pytest plugins are pinned against the pytest major.
      testing:
        patterns:
          - "pytest"
          - "pytest-*"
      puppeteer-python-misc:
        patterns:
          - "*"

  # ─── Test suite · puppeteer-python Node bridge (npm) ───────────────────────
  # The Python suite drives Chrome through bridge/server.mjs (Puppeteer).
  - package-ecosystem: npm
    directory: "/puppeteer-python/bridge"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:40"
      timezone: "Europe/Madrid"
    assignees:
      - "augustocristian"
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(puppeteer-bridge)"
    versioning-strategy: "increase"
    rebase-strategy: "auto"
    open-pull-requests-limit: 20
    groups:
      # One group per lock file (see header).
      puppeteer-bridge:
        patterns:
          - "*"
