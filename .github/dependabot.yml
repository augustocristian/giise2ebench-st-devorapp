  #       patterns: ["Microsoft.Playwright*"]
  #     playwright-csharp-misc:
  #       patterns: ["*"]
  #
  # - package-ecosystem: pip              # puppeteer-python/
  #   directory: "/puppeteer-python"
  #   schedule:
  #     interval: weekly
  #     day: "friday"
