name: "Start DevorApp SUT"
description: >-
  Boots the DevorApp System Under Test (db + keras-api + backend + frontend)
  with Docker Compose using dummy credentials, and waits until the backend
  health endpoint answers. Shared by every E2E stage of the pipeline so all the
  test-technology combinations exercise an identically configured SUT.

inputs:
  services:
    description: "Space-separated docker compose services to start."
    required: false
    default: "db keras-api backend frontend"
  health-timeout:
    description: "Seconds to wait for GET /health before giving up."
    required: false
    default: "180"

outputs:
  backend-url:
    description: "Base URL of the FastAPI backend (LOCALHOST_URL / apiUrl)."
    value: "http://localhost:8000"
  frontend-url:
    description: "Base URL of the React frontend (FRONTEND_URL / baseUrl)."
    value: "http://localhost"

runs:
  using: "composite"
  steps:
    - name: Create dummy Firebase credentials and .env configuration files
      shell: bash
      working-directory: sut
      run: |
        # Firebase Admin is a lazy singleton: an empty JSON is enough to boot.
        echo '{}' > backend/firebase-service-account.json

        cat <<'EOF' > backend/.env
        FIREBASE_PROJECT_ID=epi-devorapp
        FIREBASE_API_KEY=dummy_firebase_key
        GOOGLE_API_KEY=dummy_google_key
        FIREBASE_SERVICE_ACCOUNT_PATH=firebase-service-account.json
        SECRET_KEY=dummy_secret_key
        DATABASE_URL=postgresql://postgres:password@db:5432/tfg_db
        KERAS_API_URL=http://keras-api:8001/predict
        KERAS_API_KEY=devorapp_6f8e2b9a1c4d5e0f7a3b8c9d0e1f2a3b4c5d6e7f8
        GOOGLE_CLIENT_ID=dummy_google_client_id
        EOF

        cat <<'EOF' > keras-api/.env
        API_KEY_RECOMMENDER=devorapp_6f8e2b9a1c4d5e0f7a3b8c9d0e1f2a3b4c5d6e7f8
        MODEL_PATH=./models/modelo_prod.h5
        PORT=8001
        DATABASE_URL=postgresql://postgres:password@db:5432/tfg_db
        GOOGLE_API_KEY=dummy_google_key
        EOF

    - name: Start DevorApp via Docker Compose
      shell: bash
      working-directory: sut
      run: docker compose up -d --build ${{ inputs.services }}

    - name: Wait for the SUT to become ready
      shell: bash
      working-directory: sut
      run: |
        echo "Waiting up to ${{ inputs.health-timeout }}s for http://localhost:8000/health ..."
        for i in $(seq 1 ${{ inputs.health-timeout }}); do
          if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
            echo "Backend is healthy after ${i}s."
            curl -fsS -o /dev/null -w "Frontend answered with HTTP %{http_code}\n" http://localhost/ || \
              echo "::warning title=Frontend::Backend is up but the frontend did not answer yet."
            exit 0
          fi
          sleep 1
        done
        echo "::error title=SUT startup::/health did not answer within ${{ inputs.health-timeout }}s."
        docker compose ps
        docker compose logs --no-color --tail 120
        exit 1
