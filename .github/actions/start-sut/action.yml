name: "Start DevorApp SUT"
description: >-
  Loads the images built once by the `build-images` matrix (artifacts `image-<service>`) and starts the
  dev stack from them without rebuilding (sut/docker-compose.dev.override.yml). No credentials needed.
  Each calling job gets its own instance. Relies on the workflow-level IMAGE_TAG.

inputs:
  health-timeout:
    description: "Seconds to wait for the backend /health endpoint."
    required: false
    default: "180"

runs:
  using: "composite"
  steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: image-*
        merge-multiple: true
        path: ${{ runner.temp }}/images

    - name: Load the images
      shell: bash
      run: |
        ls -lh "${{ runner.temp }}/images"
        for f in "${{ runner.temp }}"/images/*.tar.gz; do docker load -i "$f"; done

    - name: Start the dev stack (no build)
      shell: bash
      working-directory: sut
      run: docker compose -f docker-compose.yml -f docker-compose.dev.override.yml up -d --no-build

    - name: Wait for the SUT
      shell: bash
      working-directory: sut
      run: |
        for i in $(seq 1 ${{ inputs.health-timeout }}); do
          curl -fsS http://localhost:8000/health >/dev/null 2>&1 && curl -fsS http://localhost/ >/dev/null 2>&1 \
            && echo "SUT ready after ${i}s" && exit 0
          sleep 1
        done
        echo "::error::SUT not ready after ${{ inputs.health-timeout }}s"
        docker ps -a
        docker compose -f docker-compose.yml -f docker-compose.dev.override.yml logs --no-color --tail 100
        exit 1
