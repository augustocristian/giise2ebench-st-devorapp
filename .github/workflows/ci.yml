  # ─── E2E · PUPPETEER + PYTHON ───────────────────────────────────────────────
  e2e-puppeteer-python:
    name: "E2E: Puppeteer + Python"
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    steps:
