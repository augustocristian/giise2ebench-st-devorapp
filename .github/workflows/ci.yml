  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 5 — MOBILE DELIVERY
  # ═══════════════════════════════════════════════════════════════════════════

  build-android-apk:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sut/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: sut/frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: sut/frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: sut/frontend
        run: npx cap sync android

      - name: Build & Sign APK
        id: build_apk
        working-directory: sut/frontend/android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          # Fix Windows CRLF line endings in gradlew (committed from Windows)
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "KEYSTORE_FILE secret is not set. Building auto-signed debug APK."
            ./gradlew assembleDebug
            # Copy debug apk to a standard location so we can still upload it as artifact
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building and signing Release APK using configured Keystore."
            echo "$KEYSTORE_FILE" | base64 --decode > keystore.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=keystore.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEYSTORE_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASSWORD"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: devorapp-release-apk
          path: sut/frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: sut/frontend/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
