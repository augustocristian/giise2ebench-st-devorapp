# ─────────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline — giise2ebench-st-devorapp
#
# The pipeline is organised in stages; each stage only starts once the previous
# one is green (expressed with `needs:`):
#
#   STAGE 1  BUILD & UNIT TEST   backend-ci · keras-api-ci · frontend-ci
#   STAGE 2  STATIC ANALYSIS     sonar-analysis          (skipped for Dependabot)
#   STAGE 3  PACKAGE             build-docker-images
#   STAGE 4  SYSTEM E2E TESTS    one stage per test-technology combination
#   STAGE 5  MOBILE DELIVERY     build-android-apk
#
# Stage 4 holds one stage per E2E technology combination of the benchmark.
# They are intentionally EMPTY for now — the scaffolding (SUT startup through
# .github/actions/start-sut, toolchain setup, invocation) is left commented in
# each job so wiring a suite is a matter of uncommenting it.
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD Pipeline

on:
  push:
    branches: [ main, desarrollo ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1 — BUILD & UNIT TEST
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── BACKEND TEST & COVERAGE ────────────────────────────────────────────────
  backend-ci:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'
          cache-dependency-path: sut/backend/poetry.lock

      - name: Install postgres dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc

      - name: Install backend dependencies
        working-directory: sut/backend
        run: poetry install --with dev

      - name: Run backend unit and integration tests
        working-directory: sut/backend
        run: poetry run pytest tests/ -v --cov=app --cov-report=xml:coverage.xml

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: sut/backend/coverage.xml

  # ─── KERAS API (RECOMMENDATION MODEL) TEST & COVERAGE ───────────────────────
  keras-api-ci:
    name: Keras API Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: sut/keras-api/requirements.txt

      - name: Install Keras API dependencies
        working-directory: sut/keras-api
        run: pip install -r requirements.txt

      - name: Run Keras API tests
        working-directory: sut/keras-api
        run: pytest test_main.py -v --cov=. --cov-report=xml:coverage.xml

      - name: Upload Keras Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keras-coverage
          path: sut/keras-api/coverage.xml

  # ─── GOOGLE PLACES MOCK TEST & COVERAGE ─────────────────────────────────────
  # Test infrastructure, not a shipped service: it is never published to GHCR,
  # but the E2E stages depend on its wire contract, so it is tested like the rest.
  gplaces-mock-ci:
    name: Places Mock Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'
          cache-dependency-path: sut/gplaces-mock/poetry.lock

      - name: Install gplaces-mock dependencies
        working-directory: sut/gplaces-mock
        run: poetry install

      - name: Run gplaces-mock tests
        working-directory: sut/gplaces-mock
        run: poetry run pytest

      - name: Run flake8
        working-directory: sut/gplaces-mock
        run: poetry run flake8 gplaces_mock tests

      - name: Upload Places Mock Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gplaces-mock-coverage
          path: sut/gplaces-mock/coverage.xml

  # ─── FRONTEND LINT & TEST ───────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sut/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: sut/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: sut/frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: sut/frontend
        run: npm run test -- --coverage

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: sut/frontend/coverage/

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2 — STATIC ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── STATIC ANALYSIS (SONAR) ────────────────────────────────────────────────
  # Not run for Dependabot: its pull requests get a read-only token with no
  # access to SONAR_TOKEN, so the scan could only ever fail. Stage 3 explicitly
  # tolerates this job being skipped (see its `if:`), so dependency-update PRs
  # still go through packaging and the E2E stages.
  sonar-analysis:
    name: SonarQube static analysis
    runs-on: ubuntu-latest
    needs: [backend-ci, keras-api-ci, gplaces-mock-ci, frontend-ci]
    if: ${{ github.actor != 'dependabot[bot]' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download Backend Coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: sut/backend

      - name: Download Keras Coverage
        uses: actions/download-artifact@v8
        with:
          name: keras-coverage
          path: sut/keras-api

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: sut/frontend/coverage/

      - name: SonarQube Scan
        # sonar-project.properties lives in sut/ and its paths are relative to it.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          projectBaseDir: sut
          args: >
            -Dsonar.jasmin.internal.disabled=true
            -Dsonar.jasmin.internal.js.ts.disabled=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report missing Sonar token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning title=SonarQube::SONAR_TOKEN is not configured - static analysis was skipped."

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3 — PACKAGE
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── DOCKER PACKAGING ───────────────────────────────────────────────────────
  # Images are always built (so a broken Dockerfile fails the PR) but only
  # pushed to GHCR outside pull requests, where the token is writable.
  build-docker-images:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, keras-api-ci, gplaces-mock-ci, frontend-ci, sonar-analysis]
    if: >-
      ${{ !cancelled()
      && needs.backend-ci.result == 'success'
      && needs.keras-api-ci.result == 'success'
      && needs.gplaces-mock-ci.result == 'success'
      && needs.frontend-ci.result == 'success'
      && needs.sonar-analysis.result != 'failure' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Firebase service account file
        working-directory: sut
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > backend/firebase-service-account.json
          else
            echo '{}' > backend/firebase-service-account.json
          fi

      - name: Build and push Docker images
        working-directory: sut
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          PUSH=${{ github.event_name != 'pull_request' }}

          push_image() {
            if [ "$PUSH" = "true" ]; then
              docker push "$1"
            else
              echo "Pull request build - skipping push of $1"
            fi
          }

          for SERVICE in backend frontend keras-api; do
            IMAGE=${{ env.REGISTRY }}/$REPO_LOWER/$SERVICE
            docker build -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" ./$SERVICE
            push_image "$IMAGE:$SHORT_SHA"
            push_image "$IMAGE:latest"

            # If running on a tag, also push the version tag
            if [ "${{ github.ref_type }}" = "tag" ]; then
              docker tag "$IMAGE:$SHORT_SHA" "$IMAGE:${{ github.ref_name }}"
              push_image "$IMAGE:${{ github.ref_name }}"
            fi
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4 — SYSTEM E2E TESTS (one stage per technology combination)
  #
  # All four stages are placeholders for now. To wire one up:
  #   1. uncomment its steps,
  #   2. point the suite at the SUT started by ./.github/actions/start-sut
  #      (backend http://localhost:8000, frontend http://localhost).
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── E2E · SELENIUM + JAVA ──────────────────────────────────────────────────
  e2e-selenium-java:
    name: "E2E: Selenium + Java"
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # - name: Start DevorApp (SUT)
      #   uses: ./.github/actions/start-sut
      #
      # - name: Set up JDK 17
      #   uses: actions/setup-java@v6
