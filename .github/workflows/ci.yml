        run: echo "::notice title=Selenium + Java::E2E stage reserved - no tests wired yet."

  # ─── E2E · PLAYWRIGHT + C# ──────────────────────────────────────────────────
  e2e-playwright-csharp:
    name: "E2E: Playwright + C#"
    runs-on: ubuntu-latest
