# CI/CD pipeline. Each stage starts once the previous one is green (`needs:`):
#   1 unit tests -> 2 sonar -> 3 build images once + APK (after Sonar) -> 4 E2E suites -> 5 publish (main/tags)
# Images are built once (a matrix leg per service); every E2E job loads them and starts its own SUT instance with the
# dev environment (Firebase emulator + gplaces-mock, no secrets), in parallel.
name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ci   # tag of the images built once and reused by every later job
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:

  # A push to a branch that already has an open PR is covered by the pull_request run: skip it.
  # main and tags always run (they publish).
  gate:
    name: Skip duplicate run
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            OPEN=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq length)
            [ "$OPEN" -gt 0 ] && RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1 — BUILD & UNIT TEST
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── BACKEND TEST & COVERAGE ────────────────────────────────────────────────
  backend-ci:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'
          cache-dependency-path: sut/backend/poetry.lock

      - name: Install postgres dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc

      - name: Install backend dependencies
        working-directory: sut/backend
        run: poetry install --with dev

      - name: Run backend unit and integration tests
        working-directory: sut/backend
        run: poetry run pytest tests/ -v --cov=app --cov-report=xml:coverage.xml

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: sut/backend/coverage.xml

  # ─── KERAS API (RECOMMENDATION MODEL) TEST & COVERAGE ───────────────────────
  keras-api-ci:
    name: Keras API Test & Coverage
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'
          cache-dependency-path: sut/keras-api/poetry.lock

      - name: Install Keras API dependencies
        working-directory: sut/keras-api
        run: poetry install --with dev

      - name: Run Keras API tests
        working-directory: sut/keras-api
        run: poetry run pytest test_main.py -v --cov=. --cov-report=xml:coverage.xml

      - name: Upload Keras Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keras-coverage
          path: sut/keras-api/coverage.xml

  # ─── GOOGLE PLACES MOCK TEST & COVERAGE ─────────────────────────────────────
  # Test infrastructure, not a shipped service: it is never published to GHCR,
  # but the E2E stages depend on its wire contract, so it is tested like the rest.
  gplaces-mock-ci:
    name: Places Mock Test & Coverage
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'
          cache-dependency-path: sut/gplaces-mock/poetry.lock

      - name: Install gplaces-mock dependencies
        working-directory: sut/gplaces-mock
        run: poetry install

      - name: Run gplaces-mock tests
        working-directory: sut/gplaces-mock
        run: poetry run pytest

      - name: Run flake8
        working-directory: sut/gplaces-mock
        run: poetry run flake8 gplaces_mock tests

      - name: Upload Places Mock Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gplaces-mock-coverage
          path: sut/gplaces-mock/coverage.xml

  # ─── FRONTEND LINT & TEST ───────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sut/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: sut/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: sut/frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: sut/frontend
        run: npm run test -- --coverage

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: sut/frontend/coverage/

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2 — STATIC ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── STATIC ANALYSIS (SONAR) ────────────────────────────────────────────────
  # Not run for Dependabot: its pull requests get a read-only token with no
  # access to SONAR_TOKEN, so the scan could only ever fail. Stage 3 explicitly
  # tolerates this job being skipped (see its `if:`), so dependency-update PRs
  # still go through packaging and the E2E stages.
  sonar-analysis:
    name: SonarQube static analysis
    runs-on: ubuntu-latest
    needs: [backend-ci, keras-api-ci, gplaces-mock-ci, frontend-ci]
    if: ${{ github.actor != 'dependabot[bot]' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download Backend Coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: sut/backend

      - name: Download Keras Coverage
        uses: actions/download-artifact@v8
        with:
          name: keras-coverage
          path: sut/keras-api

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: sut/frontend/coverage/

      - name: SonarQube Scan
        # sonar-project.properties lives in sut/ and its paths are relative to it.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        with:
          projectBaseDir: sut
          args: >
            -Dsonar.jasmin.internal.disabled=true
            -Dsonar.jasmin.internal.js.ts.disabled=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report missing Sonar token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning title=SonarQube::SONAR_TOKEN is not configured - static analysis was skipped."

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3 — PACKAGE
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── BUILD IMAGES (once, one matrix leg per service) ────────────────────────
  # The same images serve dev, E2E and prod: only their environment differs
  # (docker-compose.dev.override.yml vs. docker-compose.yml). Each leg builds one service
  # with compose (a single source of truth for contexts and tags) and shares it as an artifact.
  build-images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-ci, keras-api-ci, gplaces-mock-ci, frontend-ci, sonar-analysis]
    if: >-
      ${{ !cancelled()
      && needs.backend-ci.result == 'success'
      && needs.keras-api-ci.result == 'success'
      && needs.gplaces-mock-ci.result == 'success'
      && needs.frontend-ci.result == 'success'
      && needs.sonar-analysis.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, keras-api, gplaces-mock, firebase-emulator]
    steps:
      - uses: actions/checkout@v7

      - name: Build
        working-directory: sut
        run: docker compose -f docker-compose.yml -f docker-compose.dev.override.yml build ${{ matrix.service }}

      - name: Save
        shell: bash   # -o pipefail: a failed `docker save` must fail the job, not leave an empty archive
        run: |
          docker save "devorapp/${{ matrix.service }}:${IMAGE_TAG}" | gzip > "${{ matrix.service }}.tar.gz"
          gzip -t "${{ matrix.service }}.tar.gz"
          ls -lh "${{ matrix.service }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar.gz
          compression-level: 0
          retention-days: 1

  # ─── ANDROID APK (only after SonarQube passes; independent of the E2E stage) ─
  build-android-apk:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    needs: [backend-ci, keras-api-ci, gplaces-mock-ci, frontend-ci, sonar-analysis]
    if: >-
      ${{ !cancelled()
      && needs.backend-ci.result == 'success'
      && needs.keras-api-ci.result == 'success'
      && needs.gplaces-mock-ci.result == 'success'
      && needs.frontend-ci.result == 'success'
      && needs.sonar-analysis.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sut/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: sut/frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: sut/frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: sut/frontend
        run: npx cap sync android

      - name: Build & Sign APK
        id: build_apk
        working-directory: sut/frontend/android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          # Fix Windows CRLF line endings in gradlew (committed from Windows)
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "KEYSTORE_FILE secret is not set. Building auto-signed debug APK."
            ./gradlew assembleDebug
            # Copy debug apk to a standard location so we can still upload it as artifact
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building and signing Release APK using configured Keystore."
            echo "$KEYSTORE_FILE" | base64 --decode > keystore.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=keystore.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEYSTORE_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASSWORD"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: devorapp-release-apk
          path: sut/frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: sut/frontend/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── PUBLISH (main and tags only) ───────────────────────────────────────────
  # Pushes the images built above, nothing is rebuilt, and only once every E2E
  # suite has passed.
  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs:
      - build-images
      - e2e-selenium-java
      - e2e-cypress-javascript
      - e2e-playwright-csharp
      - e2e-puppeteer-python
    if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          for f in *.tar.gz; do docker load -i "$f"; done
          REPO=${{ env.REGISTRY }}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          for SERVICE in backend frontend keras-api; do
            for TAG in "$(echo "${{ github.sha }}" | cut -c1-7)" latest $VERSION; do
              docker tag "devorapp/$SERVICE:${IMAGE_TAG}" "$REPO/$SERVICE:$TAG"
            done
            docker push --all-tags "$REPO/$SERVICE"
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4 — SYSTEM E2E TESTS (one job per technology, run in parallel)
  # ═══════════════════════════════════════════════════════════════════════════

  e2e-selenium-java:
    name: "E2E: Selenium + Java"
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v7

      - name: Start DevorApp (own SUT instance)
        uses: ./.github/actions/start-sut

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run E2E & API tests (headless)
        working-directory: selenium-java
        run: mvn -B test -Dheadless=true

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py --title "Selenium + Java" --format junit 'selenium-java/target/**/surefire-reports/TEST-*.xml'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-java-reports
          path: selenium-java/target/**/surefire-reports/

  e2e-cypress-javascript:
    name: "E2E: Cypress + JavaScript"
    runs-on: ubuntu-latest
    needs: [build-images]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cypress-js/package-lock.json

      - name: Install dependencies
        working-directory: cypress-js
        run: npm ci

      # Lint first: a style failure should not wait for the SUT to start.
      - name: Lint and format check
        working-directory: cypress-js
        run: |
          npm run lint
          npm run format:check

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('cypress-js/package-lock.json') }}

      # npm >= 11 does not run the Cypress postinstall; verify/download the binary explicitly.
      - name: Install Cypress binary
        working-directory: cypress-js
        run: npm run cypress:install

      - name: Start DevorApp (own SUT instance)
        uses: ./.github/actions/start-sut

      - name: Run E2E & API specs
        working-directory: cypress-js
        shell: bash   # pipefail keeps npm test's exit code through the filter below
        # Electron logs a harmless D-Bus/NetworkManager error per page: runners have no NetworkManager.
        run: npm test 2>&1 | sed '/object_proxy.cc/d'

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py --title "Cypress + JavaScript" --format junit 'cypress-js/results/*.xml'

      - name: Upload screenshots and JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-js-reports
          path: |
            cypress-js/cypress/screenshots/
            cypress-js/results/
          if-no-files-found: ignore

  e2e-playwright-csharp:
    name: "E2E: Playwright + C#"
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v7

      - name: Start DevorApp (own SUT instance)
        uses: ./.github/actions/start-sut

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: playwright-csharp
        run: dotnet build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-dotnet-${{ runner.os }}-${{ hashFiles('playwright-csharp/DevorApp.E2ETests.csproj') }}

      - name: Install Playwright browsers
        working-directory: playwright-csharp
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E & API tests
        working-directory: playwright-csharp
        run: dotnet test --no-build --logger "trx;LogFileName=results.trx" --results-directory target/ci

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py --title "Playwright + C#" --format trx 'playwright-csharp/target/ci/*.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-csharp-reports
          path: playwright-csharp/target/ci/
          if-no-files-found: ignore

  # ─── Not wired yet ──────────────────────────────────────────────────────────
  e2e-puppeteer-python:
    name: "E2E: Puppeteer + Python"
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - run: echo "::notice title=Puppeteer + Python::E2E stage reserved - no tests wired yet."
